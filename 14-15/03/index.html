<ul>
  <li>Принцип работы алгоритма
  <br>

  <li>Введите число A: <input id="num" type="number" step="any" value="0">
  </li>
  <li>Результат: <input id="result" value="Не определено">
  </li>
  <li><input id="verify" type="button" value="Вычислить">
  </li>
